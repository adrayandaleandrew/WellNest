name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache root dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: root-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: root-node-modules-

      - name: Cache admin dependencies
        uses: actions/cache@v4
        with:
          path: admin/node_modules
          key: admin-node-modules-${{ hashFiles('admin/package-lock.json') }}
          restore-keys: admin-node-modules-

      - name: Install root dependencies
        run: npm ci

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Lint admin panel
        working-directory: admin
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build admin panel
        working-directory: admin
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build
